<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Order Confirmed</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background-color: #f9f9f9;
      }
      .card {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .icon {
        font-size: 48px;
        color: #28a745;
        margin-bottom: 10px;
      }
      h1 {
        color: #333;
        margin-bottom: 15px;
      }
      p {
        color: #555;
        font-size: 16px;
        line-height: 1.5;
      }
      .btn {
        display: inline-block;
        margin-top: 25px;
        padding: 10px 20px;
        background-color: green;
        color: white;
        text-decoration: none;
        border-radius: 4px;
      }
      .btn:hover {
        background-color: darkgreen;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Order Received!</h1>
      <p>
        Thank you for shopping with us. We have received your order and will
        contact you soon for delivery.
      </p>

      <a th:href="@{/orders/form}" class="btn">Place Another Order</a>
    </div>
  </body>
</html>
